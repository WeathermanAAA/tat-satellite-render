# HIMAWARI-9 FULL DISK — BROWSE-BAND lane (2026-07-25, box2).
#
# Same shape as the GOES-19 FD lane (see its header for the ordering rationale
# and the RAM measurement that argues for one container per satellite):
#
# The 22 AHI bands nobody animates; the five loop leads live in
# docker-compose.s2.hw-fd-leads.yml so their latency is a ~3 min pass rather
# than this lane's full sweep. Grid arithmetic is the same as the GOES-19
# browse lane: 22 products x 3 slots/h x ~39 s = 2574 s/h = 0.71x real time at
# a 20-min grid, which fits; 10 min would need 1.43x and cannot be done
# serially. --backfill 120 exceeds the revisit so nothing ages out unseen.
#
# AHI FLDK scans every 10 min; this suite previously rode the shared rotation
# and refreshed ~5 h.
#
# 12g, not 10g: the AHI path decompresses 10 HSD segments per band before the
# mosaic, and the 28-product wpac suite OOM-killed (rc=137) at the old 8g cap.
#
# Start:
#   docker compose -p tat-s2-hwfd -f docker-compose.s2.yml \
#     -f docker-compose.s2.hw-fd-lane.yml --profile cron up -d --no-build emit-cron
services:
  emit-cron:
    environment:
      S2_CUT_WORKERS: "3"
    mem_limit: 12g
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BROWSE="b01 b02 b03 b04 b05 b06 b07 b09 b10 b11 b12 b14 b15 b16 \
                ash dust nightmicro firetemp daycloudphase dayconvection \
                daylandcloud snowfog"
        echo "[s2-hwfd] himawari9-fd browse catalog: 22 bands @20min (z5 native)"
        while true; do
          for prod in $$BROWSE; do
            python s2_pyramid_emit.py --product himawari9-fd-$$prod \
              --store r2 --prefix shadow --max-zoom 5 \
              --allow-geometry-change --step 20 --backfill 120 \
              || echo "[s2-hwfd] $$prod failed rc=$$? (next tick retries)"
          done
          sleep 30
        done
