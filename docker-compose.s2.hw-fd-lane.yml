# HIMAWARI-9 FULL DISK — dedicated lane (2026-07-25).
#
# Same shape as the GOES-19 FD lane (see its header for the ordering rationale
# and the RAM measurement that argues for one container per satellite):
#
#   every pass   ir irbd sandwich airmass b08   on the NATIVE 10-min grid
#   then         one quarter of the 22 browse bands on a 30-min grid
#
# The browse grid is explicit, and it is what the box can actually sustain:
# a 305-tile FD product-slot costs ~39 s, so all 27 products on the 10-min grid
# would need 1.75x real time on a serial lane. Leads @10 min + browse @30 min
# is 0.80x. Leaving browse on --step 10 with a revisit longer than its backfill
# window silently drops the slots that age out -- a loop full of holes rather
# than a slower, uniform one. --backfill 240 exceeds the MEASURED ~142 min
# revisit (4 passes x ~36 min) so nothing ages out unseen between visits.
#
# AHI FLDK scans every 10 min; this suite previously rode the shared rotation
# and refreshed ~5 h.
#
# 12g, not 10g: the AHI path decompresses 10 HSD segments per band before the
# mosaic, and the 28-product wpac suite OOM-killed (rc=137) at the old 8g cap.
#
# Start:
#   docker compose -p tat-s2-hwfd -f docker-compose.s2.yml \
#     -f docker-compose.s2.hw-fd-lane.yml --profile cron up -d --no-build emit-cron
services:
  emit-cron:
    environment:
      S2_CUT_WORKERS: "3"
    mem_limit: 12g
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        LEAD="ir irbd sandwich airmass b08"
        B0="b01 b02 b03 b04 b05 b06"
        B1="b07 b09 b10 b11 b12"
        B2="b14 b15 b16 ash dust"
        B3="nightmicro firetemp daycloudphase dayconvection daylandcloud snowfog"
        echo "[s2-hwfd] himawari9-fd: leads=[$$LEAD] @10min + 1/4 of the browse catalog @30min (z5 native)"
        n=0
        while true; do
          for prod in $$LEAD; do
            python s2_pyramid_emit.py --product himawari9-fd-$$prod \
              --store r2 --prefix shadow --max-zoom 5 \
              --allow-geometry-change --step 10 --backfill 60 \
              || echo "[s2-hwfd] lead $$prod failed rc=$$? (next tick retries)"
          done
          eval "BROWSE=\$$B$$((n % 4))"
          for prod in $$BROWSE; do
            python s2_pyramid_emit.py --product himawari9-fd-$$prod \
              --store r2 --prefix shadow --max-zoom 5 \
              --allow-geometry-change --step 30 --backfill 240 \
              || echo "[s2-hwfd] browse $$prod failed rc=$$? (next tick retries)"
          done
          n=$$((n + 1))
          sleep 30
        done
