# HIMAWARI-9 FULL DISK — dedicated lane (2026-07-25).
#
# Same shape as the GOES-19 FD lane (see its header for the ordering rationale
# and the RAM measurement that argues for one container per satellite):
#
#   every pass   ir irbd sandwich airmass b08
#   then         one quarter of the 22 browse bands
#
# AHI FLDK scans every 10 min; this suite previously rode the shared rotation
# and refreshed ~5 h.
#
# 12g, not 10g: the AHI path decompresses 10 HSD segments per band before the
# mosaic, and the 28-product wpac suite OOM-killed (rc=137) at the old 8g cap.
#
# Start:
#   docker compose -p tat-s2-hwfd -f docker-compose.s2.yml \
#     -f docker-compose.s2.hw-fd-lane.yml --profile cron up -d --no-build emit-cron
services:
  emit-cron:
    environment:
      S2_CUT_WORKERS: "3"
    mem_limit: 12g
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        LEAD="ir irbd sandwich airmass b08"
        B0="b01 b02 b03 b04 b05 b06"
        B1="b07 b09 b10 b11 b12"
        B2="b14 b15 b16 ash dust"
        B3="nightmicro firetemp daycloudphase dayconvection daylandcloud snowfog"
        echo "[s2-hwfd] Himawari-9 FD: leads=[$$LEAD] + 1/4 of the browse catalog per pass (z5 native)"
        n=0
        while true; do
          eval "BROWSE=\$$B$$((n % 4))"
          for prod in $$LEAD $$BROWSE; do
            python s2_pyramid_emit.py --product himawari9-fd-$$prod \
              --store r2 --prefix shadow --max-zoom 5 \
              --allow-geometry-change --step 10 --backfill 60 \
              || echo "[s2-hwfd] $$prod failed rc=$$? (next tick retries)"
          done
          n=$$((n + 1))
          sleep 30
        done
