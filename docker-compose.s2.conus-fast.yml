# CONUS FAST LANE (2026-07-19, v3: c02 at NATIVE z7 via parallel PUTs): the four
# loop-lead products on the true 10-min slot grid. Resolution: c02 (0.5 km
# native) now cuts to NATIVE z7 on a 10240 px base — the serial-upload
# ceiling fell with the emitter's bounded-parallel tile PUTs
# (S2_PUT_WORKERS). The
# 2 km-class products (ir/irbd) are NATIVE-BOUND at z5 (source is 2500 px
# across this box) — deeper tiles would upsample, not sharpen. truecolor
# (v4, 2026-07-23) cuts NATIVE z7 off the registry 6144 px base + 6144 fetch
# cap: the C02 red channel is 0.5 km, so zoomed tiles sharpen instead of
# upsampling; the Rayleigh transient fits the 12g cap.
# Start:
#   docker compose -p tat-s2-conus-fast -f docker-compose.s2.yml \
#     -f docker-compose.s2.conus-fast.yml --profile cron up -d --no-build emit-cron
services:
  emit-cron:
    # the c02 native-z7 render (10240 px base) peaks past the stack default
    # 8g; the spike is transient (~1 min/slot) and the box carries ~10Gi
    # available. OOM-kill (rc=137) was the z7 blocker after parallel PUTs.
    mem_limit: 12g
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[s2-fast] conus loop products: ir irbd (z5) + truecolor c02 (z7)"
        while true; do
          for prod in ir irbd truecolor c02; do
            case "$$prod" in
              c02)       Z=7; PX="--pyramid-px 10240" ;;
              truecolor) Z=7; PX="" ;;
              *)         Z=5; PX="" ;;
            esac
            python s2_pyramid_emit.py --product goes19-conus-$$prod \
              --store r2 --prefix shadow --max-zoom $$Z $$PX \
              --allow-geometry-change --step 10 --backfill 60 \
              || echo "[s2-fast] $$prod failed rc=$$? (next tick retries)"
          done
          sleep 120
        done
