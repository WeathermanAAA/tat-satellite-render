# GOES-19 FULL DISK — dedicated lane (2026-07-25).
#
# Before this lane, goes19-fd shared one rotation container with both Himawari
# suites and GK-2A, so its cadence was the SUM of all of them (~5 h against a
# 10-min scan). Now nothing but GOES-19 decides when GOES-19 publishes.
#
# WITHIN the lane, the pass is ordered by what a viewer actually animates:
#
#   every pass   ir irbd sandwich airmass c08   on the NATIVE 10-min grid
#   then         one quarter of the 22 browse bands on a 30-min grid
#
# The two grids are the honest consequence of one measured fact: a 305-tile FD
# product-slot costs ~39 s, so holding ALL 27 products on the 10-min grid needs
#   27 products x 6 slots/h x 39 s = 6318 s per 3600 s hour = 1.75x real time
# on a serial lane. It cannot be done here at any pass ordering. What fits:
#   leads @10 min + browse @30 min = 2886 s/h = 0.80x real time.
#
# The browse grid is EXPLICIT (--step 30), not emergent. An earlier version
# left browse on --step 10 with a 60-min backfill and a ~2 h revisit, so every
# cycle silently dropped the slots that had aged out of the window -- loops
# with permanent holes. A 30-min grid the lane can actually fill gives a
# uniform, gapless browse loop instead. --backfill 240 is sized off the
# MEASURED revisit: a pass runs ~36 min (09:06:23 -> 09:42:01), so a quarter
# comes round every ~142 min. The window must exceed that or the slots that
# age out between visits are lost forever -- the exact hole the 60-min
# window punched. 240 leaves margin for a slow pass.
#
# Why one container and not a fast/bulk pair: RAM, measured. A full-disk cut
# peaks ~4.5 GB, the box has 31 GB, and the non-s2 stacks (meso-render, radar,
# s1, overlays) hold ~12 GB resident. Eight concurrent emit lanes tripped the
# HOST OOM killer (global_oom, not the container cap) and killed a wpac pass.
# ~5 heavy lanes is the ceiling; a second container per satellite would double
# the heavy count to buy ~15 min instead of ~30 min on browse bands.
#
# Start:
#   docker compose -p tat-s2-g19fd -f docker-compose.s2.yml \
#     -f docker-compose.s2.goes19-fd-lane.yml --profile cron up -d --no-build emit-cron
services:
  emit-cron:
    environment:
      S2_CUT_WORKERS: "3"
    mem_limit: 10g
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        LEAD="ir irbd sandwich airmass c08"
        B0="c01 c02 c03 c04 c05 c06"
        B1="c07 c09 c10 c11 c12"
        B2="c14 c15 c16 ash dust"
        B3="nightmicro firetemp daycloudphase dayconvection daylandcloud snowfog"
        echo "[s2-g19fd] goes19-fd: leads=[$$LEAD] @10min + 1/4 of the browse catalog @30min (z5 native)"
        n=0
        while true; do
          for prod in $$LEAD; do
            python s2_pyramid_emit.py --product goes19-fd-$$prod \
              --store r2 --prefix shadow --max-zoom 5 \
              --allow-geometry-change --step 10 --backfill 60 \
              || echo "[s2-g19fd] lead $$prod failed rc=$$? (next tick retries)"
          done
          eval "BROWSE=\$$B$$((n % 4))"
          for prod in $$BROWSE; do
            python s2_pyramid_emit.py --product goes19-fd-$$prod \
              --store r2 --prefix shadow --max-zoom 5 \
              --allow-geometry-change --step 30 --backfill 240 \
              || echo "[s2-g19fd] browse $$prod failed rc=$$? (next tick retries)"
          done
          n=$$((n + 1))
          sleep 30
        done
