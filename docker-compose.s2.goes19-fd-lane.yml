# GOES-19 FULL DISK — BROWSE-BAND lane (2026-07-25, after the box2 split).
#
# Before this lane, goes19-fd shared one rotation container with both Himawari
# suites and GK-2A, so its cadence was the SUM of all of them (~5 h against a
# 10-min scan). Now nothing but GOES-19 decides when GOES-19 publishes.
#
# The 22 bands nobody animates. The five loop leads moved to their own
# container (goes19-fd-leads) once box2 took the Himawari lanes and freed the
# RAM for it, so this lane no longer has to interleave them -- which is what
# let the browse grid tighten from 30 min to 20.
#
# Sustained-rate arithmetic at the measured ~39 s per 305-tile FD product-slot,
# for this lane alone (22 products, no leads):
#   @10 min grid  22 x 6 x 39 = 5148 s/h = 1.43x real time   impossible
#   @15 min       22 x 4 x 39 = 3432 s/h = 0.95x             no margin
#   @20 min       22 x 3 x 39 = 2574 s/h = 0.71x             fits
# so 20 min is the honest floor here, not 10. --backfill 120 comfortably
# exceeds the ~15 min revisit; a window narrower than the revisit silently
# drops the slots that age out between visits, which is how this lane grew
# holes twice before.
#
# Why one container and not a fast/bulk pair: RAM, measured. A full-disk cut
# peaks ~4.5 GB, the box has 31 GB, and the non-s2 stacks (meso-render, radar,
# s1, overlays) hold ~12 GB resident. Eight concurrent emit lanes tripped the
# HOST OOM killer (global_oom, not the container cap) and killed a wpac pass.
# ~5 heavy lanes is the ceiling; a second container per satellite would double
# the heavy count to buy ~15 min instead of ~30 min on browse bands.
#
# Start:
#   docker compose -p tat-s2-g19fd -f docker-compose.s2.yml \
#     -f docker-compose.s2.goes19-fd-lane.yml --profile cron up -d --no-build emit-cron
services:
  emit-cron:
    environment:
      S2_CUT_WORKERS: "3"
    mem_limit: 10g
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BROWSE="c01 c02 c03 c04 c05 c06 c07 c09 c10 c11 c12 c14 c15 c16 \
                ash dust nightmicro firetemp daycloudphase dayconvection \
                daylandcloud snowfog"
        echo "[s2-g19fd] goes19-fd browse catalog: 22 bands @20min (z5 native)"
        while true; do
          for prod in $$BROWSE; do
            python s2_pyramid_emit.py --product goes19-fd-$$prod \
              --store r2 --prefix shadow --max-zoom 5 \
              --allow-geometry-change --step 20 --backfill 120 \
              || echo "[s2-g19fd] $$prod failed rc=$$? (next tick retries)"
          done
          sleep 30
        done
