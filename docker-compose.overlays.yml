# Overlay-feed BOX POLLERS (2026-07-19): UHR ASCAT / MRMS / METAR / WPC
# surface analysis moved here from GitHub-Actions crons — GH load-sheds even
# staggered schedules to ~hourly, so a 2-min radar product rode a 10-min cron
# that fired 6x less often than declared. This is the TAT never-miss ingest
# pattern: a tight per-feed loop; each generator carries its own watermark /
# new-object gate (MRMS+SFC no-op on an unchanged stamp, UHR dedups by pass
# id and backfills the window, METAR frames by run time at the obs cadence),
# so ticks are cheap and writes happen only on new data. The box is the
# single authoritative writer; the GH workflows are dispatch-only relics.
#
# Generators live in the SITE repo (public): each service keeps a sparse
# blob-less clone and hard-resets to origin/main every tick — commit-to-main
# deploys poller code too, matching the site model.
#
# Start:  docker compose -p tat-overlays -f docker-compose.overlays.yml up -d
# Logs:   docker logs tat-overlays-<feed>-poller-1 --tail 20
x-poller: &poller
  image: tat-s2:latest
  entrypoint: ["/bin/sh", "-c"]
  env_file: .env
  restart: always
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

x-cmd: &cmd
  - |
    set -u
    REPO=/work/tat
    if [ -n "$${EXTRA_PIP:-}" ]; then
      pip install --quiet $${EXTRA_PIP} || echo "[poller] pip $${EXTRA_PIP} failed"
    fi
    if [ ! -d "$$REPO/.git" ]; then
      git clone -q --depth 1 --filter=blob:none --sparse \
        https://github.com/WeathermanAAA/Triple-A-Tropics.git "$$REPO" \
      && git -C "$$REPO" sparse-checkout set ascatobs assets scripts
    fi
    echo "[poller] $${GEN} every $${INTERVAL}s args=$${GENARGS:-}"
    while true; do
      { git -C "$$REPO" fetch -q --depth 1 origin main \
        && git -C "$$REPO" reset -q --hard FETCH_HEAD; } \
        || echo "[poller] repo refresh failed (stale copy runs this tick)"
      ( cd "$$REPO" && python $${GEN} --store r2 $${GENARGS:-} ) \
        || echo "[poller] $${GEN} rc=$$? (next tick retries)"
      sleep "$${INTERVAL}"
    done

services:
  mrms-poller:
    <<: *poller
    command: *cmd
    environment:
      GEN: generate_mrms_overlay.py
      INTERVAL: "75"          # native 2-min product: emit every new scan
      GENARGS: "--keep 220"  # ~7.3 h of 2-min scans covers the 6-h loop window
      EXTRA_PIP: pygrib       # the only generator dep the image lacks
    mem_limit: 6g
    volumes: ["/root/tat-overlays/mrms:/work"]

  metar-poller:
    <<: *poller
    command: *cmd
    environment:
      GEN: generate_metar_obs.py
      INTERVAL: "300"
    mem_limit: 1g
    volumes: ["/root/tat-overlays/metar:/work"]

  sfc-poller:
    <<: *poller
    command: *cmd
    environment:
      GEN: generate_sfc_analysis.py
      INTERVAL: "600"
    mem_limit: 1g
    volumes: ["/root/tat-overlays/sfc:/work"]

  nhc-poller:
    <<: *poller
    command: *cmd
    environment:
      GEN: generate_nhc_overlay.py
      INTERVAL: "300"
      EXTRA_PIP: pyshp   # the only generator dep the image lacks
    mem_limit: 1g
    volumes: ["/root/tat-overlays/nhc:/work"]

  uhr-poller:
    <<: *poller
    command: *cmd
    environment:
      GEN: generate_uhr_ascat.py
      INTERVAL: "300"
      GENARGS: "--max-new 8"
    mem_limit: 2g
    volumes: ["/root/tat-overlays/uhr:/work"]

  # Standard scatterometer feed (OSI SAF 12.5 km coastal NRT): the never-miss
  # loop for the pass union. CRED-GATED: the ingest needs EARTHDATA_TOKEN
  # (or EARTHDATA_USERNAME+EARTHDATA_PASSWORD, or KNMI_API_KEY) in .env —
  # until one lands the tick is a guarded no-op and the GH workflow remains
  # the writer (retire its schedule once this publishes). Every tick: build
  # into the work dir (pass-id watermark vs the live manifest, idempotent,
  # window self-heals gaps), then publish via the exact workflow contract
  # (scripts/ascat_r2_publish.py). 10-min ticks catch fresh orbits the
  # moment the source lists them — no cron shedding, no fixed-hour lag.
  ascat-poller:
    image: tat-s2:latest
    entrypoint: ["/bin/sh", "-c"]
    env_file: .env
    restart: always
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
    mem_limit: 2g
    volumes: ["/root/tat-overlays/ascat:/work"]
    command:
      - |
        set -u
        REPO=/work/tat
        if [ ! -d "$$REPO/.git" ]; then
          git clone -q --depth 1 --filter=blob:none --sparse             https://github.com/WeathermanAAA/Triple-A-Tropics.git "$$REPO"           && git -C "$$REPO" sparse-checkout set ascatobs assets scripts
        fi
        echo "[ascat-poller] armed (600s ticks; cred-gated)"
        while true; do
          { git -C "$$REPO" fetch -q --depth 1 origin main             && git -C "$$REPO" reset -q --hard FETCH_HEAD; }             || echo "[ascat-poller] repo refresh failed (stale copy runs this tick)"
          if [ -z "$${EARTHDATA_TOKEN:-}" ] && [ -z "$${EARTHDATA_USERNAME:-}" ] && [ -z "$${KNMI_API_KEY:-}" ]; then
            echo "[ascat-poller] no source credential in .env (EARTHDATA_TOKEN / EARTHDATA_USERNAME+EARTHDATA_PASSWORD / KNMI_API_KEY) — guarded idle; GH workflow remains the writer"
            sleep 1800
            continue
          fi
          ( cd "$$REPO" && rm -rf /work/ascat_build             && python generate_ascat.py --out-dir /work/ascat_build             && python scripts/ascat_r2_publish.py /work/ascat_build )             || echo "[ascat-poller] tick failed rc=$$? (next tick retries)"
          sleep 600
        done

  # Aircraft-recon mission feed (/recon/): the never-miss loop that owns the
  # mission JSON tree. Every tick: incremental build into the work dir (the
  # bulletin cache keeps a warm tick to directory listings + genuinely NEW
  # files only), then publish through the workflow contract
  # (scripts/recon_r2_publish.py: data-fingerprint gate vs the live copy so
  # idle ticks are no-ops, shrink guard on the growing union, index-last
  # upload order, targeted per-slug prunes). 90 s ticks catch each new
  # 10-min bulletin the moment it posts — no cron shedding, no hourly lag.
  recon-poller:
    <<: *poller
    mem_limit: 1g
    volumes: ["/root/tat-overlays/recon:/work"]
    command:
      - |
        set -u
        REPO=/work/tat
        if [ ! -d "$$REPO/.git" ]; then
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/WeathermanAAA/Triple-A-Tropics.git "$$REPO" \
          && git -C "$$REPO" sparse-checkout set reconobs scripts
        fi
        echo "[recon-poller] armed (90s ticks)"
        while true; do
          { git -C "$$REPO" fetch -q --depth 1 origin main \
            && git -C "$$REPO" reset -q --hard FETCH_HEAD; } \
            || echo "[recon-poller] repo refresh failed (stale copy runs this tick)"
          ( cd "$$REPO" && rm -rf /work/recon_build \
            && python generate_recon.py --out-dir /work/recon_build \
                 --cache-dir /work/cache --window-days 7 --stagger 0.05 \
            && python scripts/recon_r2_publish.py /work/recon_build ) \
            || echo "[recon-poller] tick failed rc=$$? (next tick retries)"
          sleep 90
        done

  # MIMIC-TPW2 moisture overlay (CIMSS/SSEC mirror, anonymous): hourly global
  # TPW frames for the explorer's env/tpw series. The generator presence-
  # gates on the month directory listings (the mirror lags and sometimes
  # STALLS — frozen 13 days at deploy time), backfills only within the
  # rolling 36-frame window, and no-ops when the watermark holds — so this
  # service idles honestly against a stalled upstream and self-activates
  # the moment new files list. The frontend toggle independently gates on
  # frame freshness (<3h), so stale frames never present as live.
  tpw-poller:
    <<: *poller
    command: *cmd
    environment:
      GEN: generate_mimic_tpw.py
      INTERVAL: "300"
      GENARGS: "--max-new 4"
    mem_limit: 2g
    volumes: ["/root/tat-overlays/tpw:/work"]
